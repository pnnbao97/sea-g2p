name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  # The C ABI (src/capi.rs) is what a non-Rust host links against — audio.cpp
  # loads it at runtime to read Vietnamese text. Ship it with the release so
  # such a host does not need a Rust toolchain to get it.
  capi:
    name: C ABI (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux-x86_64,  artifact: libsea_g2p_rs.so }
          - { os: windows-latest, name: windows-x86_64, artifact: sea_g2p_rs.dll }
          - { os: macos-latest,   name: macos-aarch64, artifact: libsea_g2p_rs.dylib }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release --no-default-features --features capi
      - name: Stage
        shell: bash
        run: |
          mkdir -p capi
          cp "target/release/${{ matrix.artifact }}" "capi/"
          cp include/sea_g2p.h capi/ 2>/dev/null || true
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: capi-${{ matrix.name }}
          path: capi

  capi_release:
    name: Attach the C ABI libraries to the release
    needs: [capi, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/download-artifact@v4
        with:
          pattern: capi-*
          path: capi
      - name: Name each file after its platform
        shell: bash
        run: |
          mkdir -p upload
          for dir in capi/capi-*; do
            platform="${dir#capi/capi-}"
            for file in "$dir"/*; do
              base="$(basename "$file")"
              case "$base" in
                *.h) cp "$file" "upload/$base" ;;
                *) cp "$file" "upload/${base%.*}-${platform}.${base##*.}" ;;
              esac
            done
          done
          # The dictionary the library opens. A Python user gets it inside the
          # wheel; a C host would otherwise have to pip install the package for
          # one file, so ship it here too.
          cp repo/python/sea_g2p/sea_g2p.bin upload/sea_g2p.bin
          ls -l upload
      - uses: softprops/action-gh-release@v1
        with:
          files: upload/*

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  pypi_publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, windows, macos, sdist]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
